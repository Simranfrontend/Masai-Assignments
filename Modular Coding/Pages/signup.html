<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signup</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div id="navbar"></div>

  <h2>Create Account</h2>
  <form id="signupForm">
    <input id="name" placeholder="Name" required><br>
    <input id="email" placeholder="Email" required><br>
    <input id="password" placeholder="Password" type="password" required><br>
    <button type="submit">Signup</button>
  </form>

  <div id="footer"></div>

  <script type="module" src="../scripts/signup.js"></script>
</body>
</html>
